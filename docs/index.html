<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>מערכת ג׳2 — צוות הדר</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4ECDC4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="מערכת ג׳2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta property="og:title" content="מערכת למידה מרחוק — כיתה ג׳2" />
  <meta property="og:description" content="מערכת שעות ולינקים לשיעורים — כיתה ג׳2 צוות הדר" />

  <link rel="stylesheet" href="style.css" />

  <!-- GoatCounter: replace YOUR-CODE with your site code from goatcounter.com -->
  <script data-goatcounter="https://kziv.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="page-wrapper">

    <header class="header-card">
      <div class="header-top-row">
        <button class="icon-btn" id="dark-toggle" title="מצב כהה / בהיר">🌙</button>
        <span class="deco-top" aria-hidden="true">🌸 🌈 🌼</span>
        <div class="header-top-actions">
          <button class="icon-btn notify-btn" id="notify-btn" style="display:none" title="הפעל התראות">🔔</button>
          <button class="icon-btn" id="share-btn" title="שתף קישור">📤</button>
        </div>
      </div>
      <h1>מערכת למידה מרחוק</h1>
      <div class="class-switcher">
        <label class="class-label" for="class-select">בחרו כיתה:</label>
        <select id="class-select" class="class-select">
          <option value="g32">ג׳2</option>
          <option value="g33">ג׳3</option>
        </select>
      </div>
      <div class="subtitle" id="class-subtitle">כיתה ג׳2</div>
      <div class="header-meta">
        <span class="week-range" id="week-range">…</span>
        <span class="now-pill"  id="now-pill"    style="display:none">…</span>
        <span class="next-pill" id="next-lesson">טוען…</span>
      </div>
      <div class="lesson-timer" id="lesson-timer" style="display:none">
        <span class="lesson-timer-label" id="lesson-timer-label"></span>
        <div class="lesson-timer-track">
          <div class="lesson-timer-fill" id="lesson-timer-fill"></div>
        </div>
        <span class="lesson-timer-pct" id="lesson-timer-pct"></span>
      </div>
    </header>

    <section class="schedule-card">
      <div class="schedule-card-header">
        <h2>📅 מערכת השעות</h2>
        <div class="schedule-actions">
          <button class="action-btn teal-btn" id="today-toggle">📍 היום</button>
          <button class="action-btn coral-btn" onclick="window.print()" aria-label="הדפס">🖨️</button>
        </div>
      </div>
      <div class="tt-legend">
        <span class="legend-item legend-live">🎥 שיעור מקוון</span>
        <span class="legend-item legend-task">📝 משימה</span>
      </div>
      <p class="schedule-caption">לחצו על שיעור להצטרפות</p>
      <div class="timetable-wrap">
        <table class="timetable" id="timetable"></table>
      </div>
    </section>

    <section class="teachers-card">
      <h2>🔗 קישורי המורים — כל הכיתות</h2>
      <div class="teachers-grid" id="teachers-grid">
        <p class="loading-msg">טוען קישורים…</p>
      </div>
    </section>

    <footer>
      <span>🌸</span> לעדכונים פנו למחנכת הכיתה <span>🌸</span>
      <div class="footer-links">
        <a href="https://zivklempner.github.io/g32" target="_blank" rel="noopener">🔗 zivklempner.github.io/g32</a>
        <span class="footer-sep">·</span>
        <a href="admin.html">📊 מנהל</a>
      </div>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
