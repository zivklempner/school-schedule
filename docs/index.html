<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מערכת למידה מרחוק — כיתה ג׳2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="header-card">
      <span class="deco-top">🌸 🌈 🌼</span>
      <h1>מערכת למידה מרחוק</h1>
      <div class="subtitle">כיתה ג׳2 — צוות הדר</div>
      <div class="week-range" id="week-range">…</div>
    </header>
    <section class="schedule-card">
      <h2>📅 מערכת השעות השבועית</h2>
      <div class="tt-legend">
        <span class="legend-item legend-zoom">🎥 Zoom</span>
        <span class="legend-item legend-meet">📹 Google Meet</span>
        <span class="legend-item legend-task">📝 משימה עצמאית</span>
      </div>
      <p class="schedule-caption">לחצו על שיעור כדי להצטרף ישירות</p>
      <div class="timetable-wrap">
        <table class="timetable" id="timetable"></table>
      </div>
    </section>
    <section class="teachers-card">
      <h2>🔗 כל הקישורים</h2>
      <div class="teachers-grid" id="teachers-grid">
        <p style="text-align:center;color:#888">טוען קישורים…</p>
      </div>
    </section>
    <footer>
      <span>🌸</span> לעדכונים פנו למחנכת הכיתה <span>🌸</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
